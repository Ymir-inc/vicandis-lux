<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VicandisLux</title>
    <!--
      The site is served per-locale; `/` forwards to the Romanian source language.
      Links are relative so this works both at a domain root and under a
      GitHub Pages sub-path.
    -->
    <meta http-equiv="refresh" content="0; url=./ro/" />
    <link rel="canonical" href="./ro/" />
    <link rel="alternate" hreflang="ro-MD" href="./ro/" />
    <link rel="alternate" hreflang="ru-MD" href="./ru/" />
    <link rel="alternate" hreflang="en" href="./en/" />
    <link rel="alternate" hreflang="x-default" href="./ro/" />
    <!--
      Same icon set as `app/[locale]/layout.tsx`. Without these a browser that
      lands here before the redirect fires blind-guesses `/favicon.ico`, which
      on a sub-path deployment is not ours. Relative like everything else above:
      this file is copied verbatim, so an absolute path would break the
      sub-path preview, and for the same reason `?v=` is written out by hand —
      bump it in lockstep with BRAND_ASSET_VERSION in `i18n/site.ts`.
    -->
    <link rel="icon" href="./favicon.ico?v=2" sizes="16x16 32x32 48x48" type="image/x-icon" />
    <link rel="icon" href="./icon.svg?v=2" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="./icons/icon-48.png?v=2" sizes="48x48" type="image/png" />
    <link rel="icon" href="./icons/icon-192.png?v=2" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-icon.png?v=2" sizes="180x180" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0c0b;
        color: #f7f5f0;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      a {
        color: #d6a94b;
      }
    </style>
  </head>
  <body>
    <p>Redirecționare către <a href="./ro/">VicandisLux</a>…</p>
    <script>
      location.replace('./ro/');
    </script>
  </body>
</html>
